name: Ruijie Voucher Scanner Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # GitHub Actions tab ထဲကနေ လက်နဲ့ နှိပ် run နိုင်ရန်

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies (OpenCV)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyTelegramBotAPI aiohttp ddddocr opencv-python-headless numpy

    - name: Run Telegram Bot
      run: |
        python ruijie_bot.py
        
