name: Continuous Telegram Bot Run

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # မိနစ် ၃၀ တိုင်း Bot ပိတ်နေလား စစ်ပြီး အော်တို ပြန်ဖွင့်ပေးမည်
    - cron: '*/30 * * * *'
  workflow_dispatch: # GitHub ထဲကနေ Manual နှိပ်ပြီး ခိုင်းချင်လျှင်လည်း ရအောင်

concurrency:
  group: bot-runner
  cancel-in-progress: false # Bot ၂ ခု ပြိုင်တူ မပွင့်သွားအောင် ကာကွယ်ထားခြင်း

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        # GitHub Actions ၏ သီးသန့် timeout (မိနစ် ၃၅၀ = ၅ နာရီ မိနစ် ၅၀)
        timeout-minutes: 350
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python test_worker.py
